; This is the config to boot a vm.

[image]
name = test.guest

; A raw rv32 Linux kernel image (arch/riscv/boot/Image). The machine mode
; firmware in the bootrom provides SBI itself, so no separate bootloader is
; needed.
kernel = guest/Image

; Where the kernel image is loaded, and the address the firmware enters it at.
; rv32 Linux requires this to be 4MiB aligned.
kernel_load_base = 0x80400000

; The boot argument delivered to the Linux kernel.
; earlycon gets output before the 8250 driver probes; console picks the tty
; that userspace gets.
bootarg = console=ttyS0 earlycon=uart8250,mmio,0x10000000

; An external initial ramdisk. Optional: leave commented out when the kernel
; carries a built-in initramfs.
;initrd = ../riscv-build/initrd.cpio
;initrd_load_base = 0x88000000

[rom]
; The machine mode firmware. Its layout is:
;   0x0000 - 0x1000  unused
;   0x1000 - 0x3000  device tree blob generated by the vmm
;   0x3000 - 0x4000  boot info handoff block
;   0x4000 -         firmware image
rom_image = bootrom/bootrom.rv32.img
rom_start = 0x0
rom_size = 0x400000

[cpu]
; number of cpus, always required.
nr_cpus = 1
; the cpu index as the primary cpu to boot: optional, default:0
boot_cpu = 0
; the program counter will be set to the value when the hart is reset or poweron
; also the rom image will be loaded to the address
pc_on_reset = 0x4000

; the Core Local Interrupt Controller which generates and delivers machine
; and supervisor timer interrupts to HLIC
clint_base = 0x02000000
clint_size = 0x00010000

; the Platform Level Interrupt Controller which routes device interrupts to
; the harts. Optional, these are the defaults.
plic_base = 0x0c000000
plic_size = 0x04000000

; How much guest time to charge for each translated block of guest code. The
; guest clock is virtual, so this sets how fast guest seconds pass relative to
; the work the guest gets done. Larger values make the guest clock run faster
; and boot finish sooner in wall-clock terms, at the cost of the guest getting
; less done between timer ticks.
ticks_per_translation_unit = 2

; the capacity of TLB, MUST BE POWER OF 2, and 16K is quite enough.
itlb_size = 0x4000
dtlb_size = 0x4000

[mem]
; required, in hexadecimal
main_memory_start = 0x80000000
; required, in decimal
main_memory_size_in_mega = 256

[misc]
; dump the device tree blob, optional
dump_dtb = ./zelda.dtb

[debug]
; the log verbosity is an integer.
;LOG_TRACE = 0, LOG_DEBUG = 1, LOG_INFO = 2, LOG_WARN = 3, LOG_ERROR = 4,
;LOG_FATAL = 5, LOG_UART = 6
; Anything below LOG_ERROR interleaves vmm chatter with the guest console.
verbosity = 3

; initial breakpoints, optional.
;breakpoints = 0x80400000
